name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # No electron binary / git hooks needed for lint-test-build
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          HUSKY: '0'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build renderer
        run: npm run build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
