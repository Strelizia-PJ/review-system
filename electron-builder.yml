appId: com.forgetting-curve.reminder
productName: 芝士学爆
directories:
  output: release
publish:
  provider: github
  owner: Strelizia-PJ
  repo: review-system
  draft: false
  prerelease: true
files:
  - dist
  - dist-electron
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon-mac.png
  identity: null
  category: public.app-category.education
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
compression: maximum
